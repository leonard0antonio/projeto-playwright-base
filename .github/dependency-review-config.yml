# Dependency Review Configuration
# https://github.com/actions/dependency-review-action#configuration-options

# Fail on high or critical vulnerabilities and allow only these SPDX licenses.
fail-on-severity: high
allow-licenses:
  - MIT
  - Apache-2.0
  - BSD-2-Clause
  - BSD-3-Clause
  - ISC
  - CC0-1.0
  - Unlicense
  - Zlib