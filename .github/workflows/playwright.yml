name: Playwright QA Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
    types: [ opened, synchronize, reopened, ready_for_review ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        type: choice
        options: [ staging, production ]
        default: staging
      browser:
        description: 'Browser to run'
        type: choice
        options: [ all, chromium, firefox, webkit ]
        default: all

env:
  NODE_VERSION: '20.x'
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

jobs:
  # ==========================================
  # QUALITY GATES - Fast feedback first
  # ==========================================
  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Run ESLint
        run: npx eslint . --ext .ts,.js --max-warnings 0 || true
        continue-on-error: true

      - name: Run TypeScript type check
        run: npx tsc --noEmit || true
        continue-on-error: true

      - name: Audit dependencies
        run: npm audit --audit-level=high || true
        continue-on-error: true

      - name: Check for outdated packages
        run: npm outdated || true
        continue-on-error: true

  # ==========================================
  # TEST MATRIX - Cross-browser & parallel
  # ==========================================
  test:
    name: Test (${{ matrix.browser }}, Node ${{ matrix.node }})
    needs: quality-gates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: ${{ github.event.inputs.browser == 'all' || github.event.inputs.browser == matrix.browser || github.event_name != 'workflow_dispatch' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            node: '20.x'
            shard: 1/2
          - browser: chromium
            node: '20.x'
            shard: 2/2
          - browser: firefox
            node: '20.x'
            shard: 1/1
          - browser: webkit
            node: '20.x'
            shard: 1/1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-${{ matrix.browser }}-

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run Playwright tests
        run: |
          npx playwright test \
            --project=${{ matrix.browser }} \
            --shard=${{ matrix.shard }} \
            --reporter=line,github,html \
            --output=test-results/${{ matrix.browser }}-${{ matrix.shard }}
        env:
          CI: true
          PLAYWRIGHT_HTML_REPORT: playwright-report/${{ matrix.browser }}-${{ matrix.shard }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.browser }}-${{ matrix.shard }}
          path: |
            test-results/${{ matrix.browser }}-${{ matrix.shard }}/
            playwright-report/${{ matrix.browser }}-${{ matrix.shard }}/
          retention-days: 30
          compression-level: 6

      - name: Upload trace on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: traces-${{ matrix.browser }}-${{ matrix.shard }}
          path: test-results/**/trace.zip
          retention-days: 7

  # ==========================================
  # MOBILE TESTS - Separate job for mobile viewports
  # ==========================================
  test-mobile:
    name: Mobile Tests
    needs: quality-gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ github.event.inputs.browser == 'all' || github.event_name != 'workflow_dispatch' }}
    strategy:
      fail-fast: false
      matrix:
        project: [ 'Mobile Chrome', 'Mobile Safari' ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run mobile tests
        run: |
          npx playwright test \
            --project="${{ matrix.project }}" \
            --reporter=line,github,html \
            --output=test-results/mobile-${{ matrix.project }}
        env:
          CI: true

      - name: Upload mobile test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-test-results-${{ matrix.project }}
          path: |
            test-results/mobile-${{ matrix.project }}/
            playwright-report/mobile-${{ matrix.project }}/
          retention-days: 30

  # ==========================================
  # VISUAL REGRESSION - Chromium only
  # ==========================================
  visual-regression:
    name: Visual Regression
    needs: quality-gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft && (github.event.inputs.browser == 'all' || github.event.inputs.browser == 'chromium' || github.event_name != 'workflow_dispatch')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run visual regression tests
        run: |
          npx playwright test \
            --project=chromium \
            --grep="@visual" \
            --reporter=line,github,html \
            --output=test-results/visual
        env:
          CI: true
          PLAYWRIGHT_UPDATE_SNAPSHOTS: ${{ github.event_name == 'workflow_dispatch' }}

      - name: Upload visual regression results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-results
          path: |
            test-results/visual/
            playwright-report/visual/
          retention-days: 30

  # ==========================================
  # PERFORMANCE TESTS - Optional, on schedule or manual
  # ==========================================
  performance:
    name: Performance Tests
    needs: quality-gates
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.browser == 'all' || github.event.inputs.browser == 'chromium'))
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run performance tests
        run: |
          npx playwright test \
            --project=chromium \
            --grep="@performance" \
            --reporter=line,github,html \
            --output=test-results/performance
        env:
          CI: true

      - name: Upload performance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-results
          path: |
            test-results/performance/
            playwright-report/performance/
          retention-days: 30

  # ==========================================
  # AGGREGATE REPORTS - Merge all results
  # ==========================================
  aggregate-reports:
    name: Aggregate Reports
    needs: [ test, test-mobile, visual-regression, performance ]
    if: always() && (needs.test.result != 'skipped' || needs.test-mobile.result != 'skipped' || needs.visual-regression.result != 'skipped' || needs.performance.result != 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download all test artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: test-results-*
          path: all-results
          merge-multiple: true

      - name: Download all report artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: playwright-report-*
          path: all-reports
          merge-multiple: true

      - name: Merge HTML reports
        run: |
          npx playwright merge-reports --reporter=html ./all-reports/*/playwright-report ./merged-report

      - name: Upload merged report
        uses: actions/upload-artifact@v4
        with:
          name: merged-playwright-report
          path: merged-report/
          retention-days: 30

      - name: Generate test summary
        run: |
          echo "## Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Browser | Status | Duration |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|----------|" >> $GITHUB_STEP_SUMMARY
          for dir in all-results/*/; do
            browser=$(basename "$dir")
            if [ -f "$dir/test-results.json" ]; then
              status=$(jq -r '.stats.expected // "unknown"' "$dir/test-results.json")
              duration=$(jq -r '.stats.duration // 0' "$dir/test-results.json")
              echo "| $browser | $status | ${duration}ms |" >> $GITHUB_STEP_SUMMARY
            fi
          done

  # ==========================================
  # NOTIFICATIONS - Slack/Teams/Email
  # ==========================================
  notify:
    name: Notify
    needs: [ aggregate-reports ]
    if: always() && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Determine overall status
        id: status
        run: |
          TEST_RESULT="${{ needs.test.result }}"
          MOBILE_RESULT="${{ needs.test-mobile.result }}"
          VISUAL_RESULT="${{ needs.visual-regression.result }}"
          
          # Treat skipped as success for overall status
          if [[ "$TEST_RESULT" == "skipped" ]]; then TEST_RESULT="success"; fi
          if [[ "$MOBILE_RESULT" == "skipped" ]]; then MOBILE_RESULT="success"; fi
          if [[ "$VISUAL_RESULT" == "skipped" ]]; then VISUAL_RESULT="success"; fi
          
          if [[ "$TEST_RESULT" == "success" && "$MOBILE_RESULT" == "success" && "$VISUAL_RESULT" == "success" ]]; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "emoji=✅" >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "emoji=❌" >> $GITHUB_OUTPUT
          fi

      - name: Post to Slack (example)
        if: env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v4.0.0
        with:
          payload: |
            {
              "text": "${{ steps.status.outputs.emoji }} Playwright Tests ${{ steps.status.outputs.status | upper }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*${{ github.repository }}* - ${{ github.workflow }} #${{ github.run_number }}"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    { "type": "mrkdwn", "text": "*Branch:* ${{ github.ref_name }}" },
                    { "type": "mrkdwn", "text": "*Commit:* ${{ github.sha }}" },
                    { "type": "mrkdwn", "text": "*Status:* ${{ steps.status.outputs.status | upper }}" },
                    { "type": "mrkdwn", "text": "*Actor:* ${{ github.actor }}" }
                  ]
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": { "type": "plain_text", "text": "View Run" },
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    },
                    {
                      "type": "button",
                      "text": { "type": "plain_text", "text": "View Report" },
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts"
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Comment on PR with summary
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number
            });
            
            const botComment = comments.find(c => c.user.type === 'Bot' && c.body.includes('Playwright Test Summary'));
            
            const summary = `## 🎭 Playwright Test Summary
            | Job | Status |
            |-----|--------|
            | Desktop Tests | ${{ needs.test.result == 'skipped' ? '⏭️ skipped' : needs.test.result }} |
            | Mobile Tests | ${{ needs.test-mobile.result == 'skipped' ? '⏭️ skipped' : needs.test-mobile.result }} |
            | Visual Regression | ${{ needs.visual-regression.result == 'skipped' ? '⏭️ skipped' : needs.visual-regression.result }} |
            | Performance | ${{ needs.performance.result || 'skipped' }} |
            
            [View Full Report](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts)
            `;
            
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: summary
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: summary
              });
            }

  # ==========================================
  # DEPLOY TO TEST ENV - Optional, on success
  # ==========================================
  deploy-staging:
    name: Deploy to Staging
    needs: [ aggregate-reports, notify ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop' && (needs.test.result == 'success' || needs.test.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    steps:
      - name: Deploy to staging
        run: |
          echo "Deploy to staging environment..."
          # Add your deployment commands here
          # e.g., kubectl apply, vercel deploy, netlify deploy, etc.

  # ==========================================
  # DEPLOY TO PROD - Manual approval required
  # ==========================================
  deploy-production:
    name: Deploy to Production
    needs: [ aggregate-reports, notify ]
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'production'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Deploy to production
        run: |
          echo "Deploy to production environment..."
          # Add your production deployment commands here
